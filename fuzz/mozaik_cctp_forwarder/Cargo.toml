[package]
name = "mozaik_cctp_forwarder_fuzz"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace]

[dependencies]
crucible-fuzzer = "=0.3.0-alpha.1"
crucible-test-context = "=0.3.0-alpha.1"
mozaik-cctp-forwarder = { path = "../../programs/mozaik-cctp-forwarder", features = ["no-entrypoint"] }

agave-feature-set = "~4.1.1"
anchor-lang = "=1.2.0"
anchor-spl = { version = "=1.2.0", default-features = false, features = ["token", "associated_token"] }
solana-account = "4.3.0"
solana-keypair = "3.1.2"
solana-pubkey = "3.0"
solana-signer = "3.0.1"
base64 = "0.22.1"
serde_json = "1.0"

libafl = { version = "0.15.1", features = ["std", "cli", "prelude"] }
libafl_bolts = { version = "0.15.1", features = ["std"] }
arbitrary = { version = "1", features = ["derive"] }
ctrlc = "3.4"

[[bin]]
name = "invariant_test"
path = "src/main.rs"

[features]
mainnet = []
devnet = []
