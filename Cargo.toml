[workspace]
members = [
    "programs/*"
]
exclude = [
    "fuzz"
]
resolver = "2"

[workspace.metadata.cli]
solana = "4.1.2"

[workspace.package]
edition = "2024"
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
