name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SOLANA_VERSION: 4.1.2

permissions:
  contents: read

jobs:
  lint:
    name: cargo fmt and clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # The tests embed the program binary, so clippy on all targets needs a build first
      - name: Build the program
        run: make build-sbf

      - name: Run rustfmt and clippy
        run: make lint
