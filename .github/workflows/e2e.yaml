name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SOLANA_VERSION: 4.1.2

permissions:
  contents: read

jobs:
  e2e:
    name: e2e lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # Runs the lifecycle tests against local validators with the devnet and the mainnet state
      - name: Run e2e tests
        run: make test-e2e
